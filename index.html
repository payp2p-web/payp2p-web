<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PayP2P</title>

  <meta
    name="description"
    content="PayP2P - Simple P2P marketplace"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">PayP2P</div>
      <div class="subtitle">Simple P2P marketplace</div>
    </header>

    <main>

      <section class="balance">
        <div class="balance-title">
          Available Balance
        </div>

        <div class="balance-amount">
          0.00 USDT
        </div>
      </section>

      <section class="actions">

        <button class="btn buy">
          Buy USDT
        </button>

        <button class="btn sell">
          Sell USDT
        </button>

      </section>

      <section>

        <div class="section-title">
          Quick Access
        </div>

        <div class="menu">

          <div class="menu-item">
            📋 My Orders
          </div>

          <div class="menu-item">
            👤 Profile
          </div>

          <div class="menu-item">
            💳 Payment Methods
          </div>

        </div>

      </section>

    </main>

    <footer>
      PayP2P © 2026
    </footer>

  </div>

</body>
</html>
